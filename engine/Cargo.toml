[package]
name = "hive-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
smallvec = "1"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"

[features]
# Opt-in Serialize/Deserialize on the public leaf types (Coord, Direction,
# Move, Color, PieceId, PieceType, PieceSlot, StackTop, Outcome). Enables the
# sibling `ui/` crate to build JSON DTOs and persist games as a move list.
# Default build is unchanged; `State` itself is intentionally not serialized.
serde = ["dep:serde"]
